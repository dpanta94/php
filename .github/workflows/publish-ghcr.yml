name: Publish to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.image.dir }} ${{ matrix.arch }}
    # native arm64 runner: free on public repos, avoids a ~30-60 min QEMU compile
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - { version: '8.5', variant: fpm, dir: 8.5/trixie/fpm }
          - { version: '8.3', variant: zts, dir: 8.3/trixie/zts }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          VERSION: ${{ matrix.image.version }}
        run: echo "full=$(jq -r --arg v "$VERSION" '.[$v].version' versions.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.dir }}
          platforms: linux/${{ matrix.arch }}
          push: true
          # per-arch tag, stitched into the multi-arch tags by the merge job
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.full }}-${{ matrix.image.variant }}-trixie-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.full }}

  merge:
    name: tag ${{ matrix.version }}-${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # aliases mirror generate-stackbrew-library.sh ([8.5]='8 latest'); "latest-" is stripped
          - { version: '8.5', variant: fpm, aliases: '8 latest' }
          - { version: '8.3', variant: zts, aliases: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -Eeuo pipefail
          full="$(jq -r --arg v "$VERSION" '.[$v].version' versions.json)"
          src="$IMAGE:$full-$VARIANT-trixie"
          args=()
          for a in "$full" "$VERSION" $ALIASES; do
            for t in "$a-$VARIANT-trixie" "$a-$VARIANT"; do
              args+=( -t "$IMAGE:${t#latest-}" )
            done
          done
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$src-amd64" "$src-arm64"
          docker run --rm "$IMAGE:$full-$VARIANT" php -v | grep -F "PHP $full "
